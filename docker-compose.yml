version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-intel-postgres
    environment:
      POSTGRES_USER: ai_intel
      POSTGRES_PASSWORD: ai_intel_password
      POSTGRES_DB: ai_intel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai-intel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
