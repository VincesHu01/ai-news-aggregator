services:
  - type: web
    name: ai-news-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: LOCAL_INGEST_ONLY
        value: 'true'
      - key: NEXUS_INGEST_TOKEN
        sync: false
      - key: FEISHU_WEBHOOK_URL
        sync: false
      - key: PUBLIC_APP_URL
        value: https://ai-news-frontend-kappa.vercel.app
      - key: PUBLIC_API_URL
        value: https://ai-news-db-egqx.onrender.com
      - key: DELIVERY_ENABLED_DEFAULT
        value: 'false'
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: COLLECTION_INTERVAL_HOURS
        value: '24'
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: '3.11.0'
